name: Windows Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-integration:
    name: Electron Integration (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Electron integration tests
        run: npm test

      - name: Upload Windows screenshots & test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-integration-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
