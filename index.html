<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheySay - Twitter / X 动态网格看板</title>
  <link rel="stylesheet" href="node_modules/gridstack/dist/gridstack.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-layout">
    <!-- 顶部全局导航栏 -->
    <header class="top-nav">
      <div class="nav-brand">
        <svg class="logo-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 20v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"></path>
          <circle cx="9" cy="8" r="4"></circle>
          <path d="M16 7a4 4 0 0 1 0 6"></path>
          <path d="M19.5 4.5a8 8 0 0 1 0 11"></path>
        </svg>
        <div class="brand-text">
          <h1 class="brand-title">TheySay</h1>
        </div>
      </div>

      <div class="nav-controls">
        <!-- 布局切换选择器 -->
        <div class="layout-control-group">
          <label for="layout-select" class="control-label">网格布局:</label>
          <select id="layout-select" class="layout-select">
            <option value="2x2" selected>2 × 2</option>
            <option value="2x3">2 × 3</option>
            <option value="3x2">3 × 2</option>
            <option value="3x3">3 × 3</option>
            <option value="4x4">4 × 4</option>
          </select>
        </div>

        <button id="btn-reset-layout" class="btn-tool" title="重置卡片大小与排序为当前网格整齐排布">
          <span>重置排版</span>
        </button>

        <div class="nav-divider"></div>

        <!-- 深色 / 浅色模式切换按钮 -->
        <button id="btn-theme-toggle" class="btn-tool btn-theme-toggle" title="切换深色 / 浅色模式">
          <span id="theme-toggle-icon">☀️</span>
          <span id="theme-toggle-text">浅色</span>
        </button>

        <div class="nav-divider"></div>

        <button id="btn-fetch-all" class="btn-fetch-all" title="并发抓取所有已配置的账号推文">
          <span class="lightning-icon">⚡</span>
          <span id="btn-fetch-all-text">全部并行抓取</span>
        </button>

        <button id="btn-login-status" class="login-status-btn checking" title="点击打开 Twitter / X 登录窗口">
          <span class="status-indicator"></span>
          <span id="login-status-text">检测登录...</span>
        </button>
      </div>
    </header>

    <!-- 全局提示 Toast 容器 -->
    <div id="toast-container" class="toast-container"></div>

    <!-- GridStack 动态可拖拽调整网格区域 -->
    <main class="dashboard-container">
      <div class="grid-stack" id="grid-stack-container"></div>
    </main>

    <!-- 后台并发离屏 Webview 容器 -->
    <div class="background-webviews-container" id="bg-webviews-container"></div>
  </div>

  <!-- 引入 GridStack 运行时与渲染脚本 -->
  <script src="node_modules/gridstack/dist/gridstack-all.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
