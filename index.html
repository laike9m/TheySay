<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheySay - Twitter / X 动态网格看板</title>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="stylesheet" href="node_modules/@mantine/core/styles.css">
  <link rel="stylesheet" href="node_modules/@mantine/notifications/styles.css">
  <link rel="stylesheet" href="node_modules/gridstack/dist/gridstack.min.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    window.twttr = (function(d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0],
        t = window.twttr || {};
      if (d.getElementById(id)) return t;
      js = d.createElement(s);
      js.id = id;
      js.src = "https://platform.twitter.com/widgets.js";
      fjs.parentNode.insertBefore(js, fjs);

      t._e = [];
      t.ready = function(f) {
        t._e.push(f);
      };

      return t;
    }(document, "script", "twitter-wjs"));
  </script>
</head>
<body>
  <div class="app-layout">
    <!-- Mantine 顶部导航栏、登录过期横幅与全局通知挂载点 -->
    <div id="mantine-top-shell-root" class="mantine-shell-mount"></div>

    <!-- GridStack 动态可拖拽调整网格区域 -->
    <main class="dashboard-container">
      <div class="grid-stack" id="grid-stack-container"></div>
    </main>

    <!-- 后台并发离屏 Webview 容器 -->
    <div class="background-webviews-container" id="bg-webviews-container"></div>
  </div>

  <!-- Mantine 详情悬浮弹窗与偏好设置 Modal 挂载点 -->
  <div id="mantine-modals-root" class="mantine-shell-mount"></div>

  <!-- 引入 GridStack 运行时与渲染脚本 -->
  <script src="node_modules/gridstack/dist/gridstack-all.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
