<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheySay - Twitter / X 动态网格看板</title>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="stylesheet" href="node_modules/gridstack/dist/gridstack.min.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    window.twttr = (function(d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0],
        t = window.twttr || {};
      if (d.getElementById(id)) return t;
      js = d.createElement(s);
      js.id = id;
      js.src = "https://platform.twitter.com/widgets.js";
      fjs.parentNode.insertBefore(js, fjs);

      t._e = [];
      t.ready = function(f) {
        t._e.push(f);
      };

      return t;
    }(document, "script", "twitter-wjs"));
  </script>
</head>
<body>
  <div class="app-layout">
    <!-- 顶部全局导航栏 -->
    <header class="top-nav">
      <div class="nav-brand">
        <svg class="logo-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 20v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"></path>
          <circle cx="9" cy="8" r="4"></circle>
          <path d="M16 7a4 4 0 0 1 0 6"></path>
          <path d="M19.5 4.5a8 8 0 0 1 0 11"></path>
        </svg>
        <div class="brand-text">
          <h1 class="brand-title">TheySay</h1>
        </div>
      </div>

      <div class="nav-controls">
        <!-- 全部已读按钮 -->
        <button id="btn-mark-all-read" class="btn-tool" title="将所有推文标记为已读">
          <svg class="icon-check-check" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 7 17l-5-5"></path>
            <path d="m22 10-7.5 7.5L13 16"></path>
          </svg>
          <span>全部已读</span>
        </button>

        <!-- 布局切换选择器 -->
        <div class="layout-control-group">
          <label for="layout-select" class="control-label">网格布局:</label>
          <select id="layout-select" class="layout-select">
            <option value="2x2" selected>2 × 2</option>
            <option value="2x3">2 × 3</option>
            <option value="3x2">3 × 2</option>
            <option value="3x3">3 × 3</option>
            <option value="4x4">4 × 4</option>
          </select>
        </div>

        <div class="nav-divider"></div>

        <!-- 深色 / 浅色模式切换 Toggle -->
        <button id="btn-theme-toggle" class="theme-toggle" role="switch" aria-checked="false" title="切换深色 / 浅色模式">
          <span class="theme-toggle-track">
            <span class="theme-toggle-bg-icon sun" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
              </svg>
            </span>
            <span class="theme-toggle-bg-icon moon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </span>
            <span class="theme-toggle-thumb">
              <svg class="theme-thumb-icon sun" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
              </svg>
              <svg class="theme-thumb-icon moon" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </span>
          </span>
        </button>

        <div class="nav-divider"></div>

        <!-- 设置按钮 (齿轮) -->
        <button id="btn-settings" class="btn-tool btn-settings" title="设置" aria-label="设置">
          <svg class="settings-gear-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>

        <!-- 登录账号下拉菜单 -->
        <div class="login-dropdown-wrapper" id="login-dropdown-wrapper">
          <button id="btn-login-menu" class="btn-tool login-dropdown-btn" title="管理登录账号">
            <span class="login-menu-status-dot" id="login-menu-status-dot"></span>
            <svg class="login-menu-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>登录账号</span>
            <svg class="dropdown-chevron" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <!-- 下拉菜单 Popover -->
          <div class="login-dropdown-menu" id="login-dropdown-menu" style="display: none;">
            <div class="login-menu-header">登录账号管理</div>
            <div class="login-menu-list">
              <!-- Twitter / X -->
              <button class="login-menu-item" id="item-login-twitter" title="点击登录或切换 Twitter / X 账号">
                <div class="login-item-left">
                  <span class="platform-icon twitter">𝕏</span>
                  <span class="platform-name">Twitter / X</span>
                </div>
                <div class="login-item-right">
                  <span class="platform-status-badge checking" id="twitter-status-badge">
                    <span class="status-indicator-dot"></span>
                    <span class="status-label" id="twitter-status-label">检测中...</span>
                  </span>
                </div>
              </button>

              <!-- Discord -->
              <button class="login-menu-item" id="item-login-discord" title="点击登录或切换 Discord 账号">
                <div class="login-item-left">
                  <span class="platform-icon discord">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                      <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                    </svg>
                  </span>
                  <span class="platform-name">Discord</span>
                </div>
                <div class="login-item-right">
                  <span class="platform-status-badge logged-out" id="discord-status-badge">
                    <span class="status-indicator-dot"></span>
                    <span class="status-label" id="discord-status-label">未登录</span>
                  </span>
                </div>
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- 全局提示 Toast 容器 -->
    <div id="toast-container" class="toast-container"></div>

    <!-- GridStack 动态可拖拽调整网格区域 -->
    <main class="dashboard-container">
      <div class="grid-stack" id="grid-stack-container"></div>
    </main>

    <!-- 后台并发离屏 Webview 容器 -->
    <div class="background-webviews-container" id="bg-webviews-container"></div>
  </div>

  <!-- 全局推文 Embed 悬浮弹窗 Modal (居中浮层，挡住原本底下的内容且不影响底层排版) -->
  <!-- 注意: 关闭态使用 .is-closed 而非 display:none —— 隐藏元素宽度为 0，
       会导致 Twitter 无法在后台预渲染嵌入卡片 -->
  <div id="tweet-popup-overlay" class="tweet-popup-overlay is-closed" tabindex="-1" aria-hidden="true">
    <div class="tweet-popup-dialog" role="dialog" aria-modal="true" aria-label="推文详情">
      <div class="tweet-popup-loading" id="tweet-popup-loading">
        <div class="spinner-small"></div>
        <span>正在加载嵌入推文...</span>
      </div>
      <div class="tweet-popup-embed-container" id="tweet-popup-embed-container"></div>
    </div>
  </div>

  <!-- 全局设置 Modal 弹窗 -->
  <div id="settings-modal-overlay" class="settings-modal-overlay is-closed" tabindex="-1" aria-hidden="true">
    <div class="settings-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-dialog-title">
      <!-- 弹窗 Header -->
      <div class="settings-modal-header">
        <div class="settings-modal-header-left">
          <svg class="settings-modal-header-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <h2 id="settings-dialog-title" class="settings-modal-title">偏好设置</h2>
        </div>
        <button id="btn-settings-close" class="settings-modal-close" title="关闭设置 (Esc)" aria-label="关闭设置">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- 弹窗 Body -->
      <div class="settings-modal-body">
        <!-- 刷新频率分组 -->
        <div class="settings-section">
          <div class="settings-section-title">数据刷新频率</div>
          <div class="settings-section-desc">分别配置 Twitter / X 与 Discord 各平台后台自动轮询的间隔时间。</div>

          <!-- Twitter 设置卡片 -->
          <div class="settings-card">
            <div class="settings-card-header">
              <div class="settings-card-platform">
                <span class="platform-icon twitter">𝕏</span>
                <div>
                  <div class="settings-card-title">Twitter / X 刷新频率</div>
                  <div class="settings-card-subtitle">监控推文的后台自动轮询周期</div>
                </div>
              </div>
            </div>
            <div class="settings-card-content">
              <div class="settings-field-row">
                <label for="setting-twitter-interval" class="settings-label">刷新间隔:</label>
                <div class="settings-input-group">
                  <select id="setting-twitter-interval" class="settings-select">
                    <option value="2">2 分钟</option>
                    <option value="3">3 分钟</option>
                    <option value="5">5 分钟</option>
                    <option value="10">10 分钟 (默认)</option>
                    <option value="15">15 分钟</option>
                    <option value="30">30 分钟</option>
                    <option value="60">60 分钟 (1 小时)</option>
                    <option value="custom">自定义...</option>
                  </select>
                  <div id="setting-twitter-custom-wrap" class="settings-custom-wrap" style="display: none;">
                    <input type="number" id="setting-twitter-custom" class="settings-input-number" min="1" max="1440" step="1" value="10">
                    <span class="settings-unit">分钟</span>
                  </div>
                </div>
              </div>
              <div class="settings-tip">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                <span>建议设为 5 ~ 15 分钟或以上，过频抓取可能触发 Twitter 频率限制 (Rate Limit) 或人机验证。</span>
              </div>
            </div>
          </div>

          <!-- Discord 设置卡片 -->
          <div class="settings-card">
            <div class="settings-card-header">
              <div class="settings-card-platform">
                <span class="platform-icon discord">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                  </svg>
                </span>
                <div>
                  <div class="settings-card-title">Discord 刷新频率</div>
                  <div class="settings-card-subtitle">监控频道消息的后台自动轮询周期</div>
                </div>
              </div>
            </div>
            <div class="settings-card-content">
              <div class="settings-field-row">
                <label for="setting-discord-interval" class="settings-label">刷新间隔:</label>
                <div class="settings-input-group">
                  <select id="setting-discord-interval" class="settings-select">
                    <option value="0.5">30 秒</option>
                    <option value="1">1 分钟</option>
                    <option value="2">2 分钟</option>
                    <option value="3">3 分钟</option>
                    <option value="5">5 分钟</option>
                    <option value="10">10 分钟 (默认)</option>
                    <option value="15">15 分钟</option>
                    <option value="30">30 分钟</option>
                    <option value="60">60 分钟 (1 小时)</option>
                    <option value="custom">自定义...</option>
                  </select>
                  <div id="setting-discord-custom-wrap" class="settings-custom-wrap" style="display: none;">
                    <input type="number" id="setting-discord-custom" class="settings-input-number" min="0.5" max="1440" step="0.5" value="10">
                    <span class="settings-unit">分钟</span>
                  </div>
                </div>
              </div>
              <div class="settings-tip">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                <span>Discord 频道消息更新通常较频繁，可根据需要设置为较短周期（如 1 ~ 5 分钟）。</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 弹窗 Footer -->
      <div class="settings-modal-footer">
        <button id="btn-settings-reset" class="btn-tool btn-settings-reset" title="恢复默认刷新频率">恢复默认</button>
        <div class="settings-modal-actions">
          <button id="btn-settings-cancel" class="btn-tool">取消</button>
          <button id="btn-settings-save" class="btn-tool btn-primary">保存设置</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 引入 GridStack 运行时与渲染脚本 -->
  <script src="node_modules/gridstack/dist/gridstack-all.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
